<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', path='style.css') }}">
    <title>Airbnb Price Prediction</title>
</head>

<body>
    <h1>Airbnb Price Prediction</h1>
   <form action="{{ url_for('predict') }}" method="POST">

    <!-- Property Type -->
    <div class="form-group">
        <label for="property_type">Property Type:</label>
        <select name="property_type" id="property_type">
            <option value="Apartment">Apartment</option>
            <option value="House">House</option>
            <option value="Condominium">Condominium</option>
            <option value="Townhouse">Townhouse</option>
            <option value="Loft">Loft</option>
            <option value="Other">Other</option>
            <option value="Guesthouse">Guesthouse</option>
            <option value="Bed & Breakfast">Bed & Breakfast</option>
            <option value="Bungalow">Bungalow</option>
            <option value="Villa">Villa</option>
            <option value="Dorm">Dorm</option>
            <option value="Guest suite">Guest suite</option>
            <option value="Camper/RV">Camper/RV</option>
            <option value="Timeshare">Timeshare</option>
            <option value="Cabin">Cabin</option>
            <option value="In-law">In-law</option>
            <option value="Hostel">Hostel</option>
            <option value="Boutique hotel">Boutique hotel</option>
            <option value="Boat">Boat</option>
            <option value="Serviced apartment">Serviced apartment</option>
            <option value="Tent">Tent</option>
            <option value="Castle">Castle</option>
            <option value="Vacation home">Vacation home</option>
            <option value="Yurt">Yurt</option>
            <option value="Hut">Hut</option>
            <option value="Treehouse">Treehouse</option>
            <option value="Chalet">Chalet</option>
            <option value="Earth House">Earth House</option>
            <option value="Tipi">Tipi</option>
            <option value="Train">Train</option>
            <option value="Cave">Cave</option>
            <option value="Casa particular">Casa particular</option>
            <option value="Parking Space">Parking Space</option>
            <option value="Lighthouse">Lighthouse</option>
            <option value="Island">Island</option>
        </select>
    </div>


    <!-- Room Type -->
    <div class="form-group">
        <label for="room_type">Room Type:</label>
        <select name="room_type" id="room_type">
            <option value="Entire home/apt">Entire home/apt</option>
            <option value="Private room">Private room</option>
            <option value="Shared room">Shared room</option>
        </select>
    </div>


    <!-- Bedrooms -->
    <div class="form-group">
        <label for="bedrooms">Number of Bedrooms:</label>
        <input
            type="number"
            name="bedrooms"
            id="bedrooms"
            value="0"
            min="0"
            max="10"
            step="1"
        >
    </div>


    <!-- Beds -->
    <div class="form-group">
        <label for="beds">Number of Beds:</label>
        <input
            type="number"
            name="beds"
            id="beds"
            value="0"
            min="0"
            max="18"
            step="1"
        >
    </div>


    <!-- Amenities -->
    <div class="form-group">
        <label for="amenities">Number of Amenities:</label>
        <input
            type="number"
            name="amenities"
            id="amenities"
            value="2"
            min="0"
            max="1496"
            step="1"
        >
    </div>


    <!-- Accommodates -->
    <div class="form-group">
        <label for="accommodates">Number of Accommodates:</label>
        <input
            type="number"
            name="accommodates"
            id="accommodates"
            value="1"
            min="1"
            max="16"
            step="1"
        >
    </div>


    <!-- Bathrooms -->
    <div class="form-group">
        <label for="bathrooms">Number of Bathrooms:</label>
        <input
            type="number"
            name="bathrooms"
            id="bathrooms"
            value="0"
            min="0"
            max="8"
            step="0.5"
        >
    </div>


    <!-- Bed Type -->
    <div class="form-group">
        <label for="bed_type">Bed Type:</label>
        <select name="bed_type" id="bed_type">
            <option value="Real Bed">Real Bed</option>
            <option value="Futon">Futon</option>
            <option value="Pull-out Sofa">Pull-out Sofa</option>
            <option value="Airbed">Airbed</option>
            <option value="Couch">Couch</option>
        </select>
    </div>


    <!-- Cancellation Policy -->
    <div class="form-group">
        <label for="cancellation_policy">Cancellation Policy:</label>
        <select name="cancellation_policy" id="cancellation_policy">
            <option value="strict">strict</option>
            <option value="moderate">moderate</option>
            <option value="flexible">flexible</option>
            <option value="super_strict_30">super_strict_30</option>
            <option value="super_strict_60">super_strict_60</option>
        </select>
    </div>


    <!-- Cleaning Fee -->
    <div class="form-group">
        <label for="cleaning_fee">Cleaning Fee:</label>
        <select name="cleaning_fee" id="cleaning_fee">
            <option value="True">Yes</option>
            <option value="False">No</option>
        </select>
    </div>


    <!-- City -->
    <div class="form-group">
        <label for="city">City:</label>
        <select name="city" id="city">
            <option value="NYC">NYC</option>
            <option value="SF">SF</option>
            <option value="DC">DC</option>
            <option value="LA">LA</option>
            <option value="Chicago">Chicago</option>
            <option value="Boston">Boston</option>
        </select>
    </div>


    <!-- Host Profile Picture -->
    <div class="form-group">
        <label for="host_has_profile_pic">Host has Profile Pic?</label>
        <select
            name="host_has_profile_pic"
            id="host_has_profile_pic"
        >
            <option value="t">Yes</option>
            <option value="f">No</option>
        </select>
    </div>


    <!-- Host Identity Verified -->
    <div class="form-group">
        <label for="host_identity_verified">Verified Host:</label>
        <select
            name="host_identity_verified"
            id="host_identity_verified"
        >
            <option value="t">Yes</option>
            <option value="f">No</option>
        </select>
    </div>


    <!-- Host Response Rate -->
    <div class="form-group">
        <label for="host_response_rate">Host Response Rate (%):</label>
        <input
            type="number"
            name="host_response_rate"
            id="host_response_rate"
            value="100"
            min="0"
            max="100"
            step="1"
        >
    </div>


    <!-- Instant Bookable -->
    <div class="form-group">
        <label for="instant_bookable">Instant Booking:</label>
        <select
            name="instant_bookable"
            id="instant_bookable"
        >
            <option value="t">Yes</option>
            <option value="f">No</option>
        </select>
    </div>


    <!-- Latitude -->
    <div class="form-group">
        <label for="latitude">Latitude:</label>
        <input
            type="number"
            name="latitude"
            id="latitude"
            value="40.7128"
            step="0.000001"
        >
    </div>


    <!-- Longitude -->
    <div class="form-group">
        <label for="longitude">Longitude:</label>
        <input
            type="number"
            name="longitude"
            id="longitude"
            value="-74.0060"
            step="0.000001"
        >
    </div>


    <!-- Number of Reviews -->
    <div class="form-group">
        <label for="number_of_reviews">Number of Reviews:</label>
        <input
            type="number"
            name="number_of_reviews"
            id="number_of_reviews"
            value="0"
            min="0"
            max="1000"
            step="1"
        >
    </div>


    <!-- Review Score -->
    <div class="form-group">
        <label for="review_scores_rating">Review Rating:</label>
        <input
            type="number"
            name="review_scores_rating"
            id="review_scores_rating"
            value="90"
            min="0"
            max="100"
            step="0.1"
        >
    </div>


    <input type="submit" value="Predict Price">
    </form>
    <div id="result">
        <h3>Your Airbnb Room Price will be <span id="finalResult">{{result}}$</span></h3>
    </div>

</body>

</html>
